name: Mac installer

on:
  workflow_dispatch:
  push:
    branches: [codex/macos-installer]
    paths:
      - .github/workflows/macos-release.yml
      - electron-builder.yml
      - package.json

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          TAG="v$VERSION"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
          # Packaging changes may differ, but all shipped application code must match the release.
          git diff --exit-code "$TAG" HEAD -- src server shared electron public index.html package-lock.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Build Apple Silicon installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:mac -- -c.mac.identity=-
      - name: Save installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hasimio-mac-arm64
          path: |
            release/desktop/*.dmg
            release/desktop/*-mac-arm64.zip
          if-no-files-found: error
      - name: Attach installers to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "release/desktop/Hasimio-$VERSION-mac-arm64.dmg" \
            "release/desktop/Hasimio-$VERSION-mac-arm64.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber
          # Ad-hoc builds are installed manually; do not publish an updater manifest
          # claiming that an Apple-signed automatic update is available.
