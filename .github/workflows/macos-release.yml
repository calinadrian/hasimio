name: Signed Mac installer

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require Apple signing credentials
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for NAME in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!NAME}" ]; then
              echo "::error::Missing signing credential: $NAME. See docs/MACOS.md."
              exit 1
            fi
          done
      - name: Select existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          TAG="v$VERSION"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
          # Packaging changes may differ, but all shipped application code must match the release.
          git diff --exit-code "$TAG" HEAD -- src server shared electron public index.html package-lock.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Build, sign and notarize Apple Silicon installer
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:mac -- -c.forceCodeSigning=true -c.mac.notarize=true
      - name: Verify Developer ID and notarization
        run: |
          APP="release/desktop/mac-arm64/Hasimio.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -F 'Authority=Developer ID Application:'
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
      - name: Save installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hasimio-mac-arm64
          path: |
            release/desktop/*.dmg
            release/desktop/*-mac-arm64.zip
            release/desktop/latest-mac.yml
          if-no-files-found: error
      - name: Attach installers to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "release/desktop/Hasimio-$VERSION-mac-arm64.dmg" \
            "release/desktop/Hasimio-$VERSION-mac-arm64.zip" \
            "release/desktop/latest-mac.yml" \
            --repo "$GITHUB_REPOSITORY" --clobber
