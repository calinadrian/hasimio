<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hasimio</title>
<style>body{background:#141414;color:#eee;font:24px Arial,sans-serif;margin:10vh 8vw}button{padding:16px 30px;font:inherit;background:#ddd;color:#111;border:0}p{max-width:800px;line-height:1.5}</style></head>
<body><h1>Hasimio</h1><p id="status">Starting the TV streaming service…</p><button onclick="location.reload()">Retry</button>
<script>
(function(){
  var bridge,deadline=Date.now()+20000;
  function check(){
    var image=new Image();
    image.onload=function(){location.replace('http://127.0.0.1:11476/');};
    image.onerror=function(){if(Date.now()<deadline)setTimeout(check,400);else document.getElementById('status').textContent='The TV service could not start. Close Hasimio and try again.';};
    image.src='http://127.0.0.1:11476/favicon.png?t='+Date.now();
  }
  try{bridge=new PalmServiceBridge();bridge.onservicecallback=function(){};bridge.call('luna://app.hasimio.tv.service/start',JSON.stringify({subscribe:true}));check();}
  catch(error){document.getElementById('status').textContent='Install this package on an LG webOS TV to start Hasimio.';}
})();
</script></body></html>
