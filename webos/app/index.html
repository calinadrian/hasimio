<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hasimio</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#141414;color:#eee;font:24px Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}.launch{padding:48px;max-width:800px}.brand{display:flex;align-items:center;justify-content:center}.symbol{width:64px;height:64px;margin-right:20px;background:#e98845;border-radius:16px;display:flex;align-items:center;justify-content:center}.symbol:after{content:"";border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:23px solid #141414;margin-left:5px}h1{font-size:48px;letter-spacing:-1px;margin:0}p{color:#aaa;font-size:22px;line-height:1.5;margin:32px 0 0}.spinner{width:28px;height:28px;margin:28px auto 0;border:3px solid #383838;border-top-color:#e98845;border-radius:50%;animation:spin 1s linear infinite}button{margin-top:28px;padding:16px 32px;font:inherit;background:#e98845;color:#141414;border:0;border-radius:8px;cursor:pointer}button:focus{outline:3px solid #fff;outline-offset:6px}[hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none;border-color:#e98845}}
</style></head>
<body><main class="launch" aria-busy="true" id="launch"><div class="brand"><span class="symbol" aria-hidden="true"></span><h1>Hasimio</h1></div><p id="status" role="status">Loading…</p><div class="spinner" id="spinner" aria-hidden="true"></div><button id="retry" hidden onclick="location.reload()">Retry</button></main>
<script>
(function(){
  var bridge,finished=false;
  var timer=setTimeout(function(){fail('Hasimio is taking longer than expected to open. Please try again.');},20000);
  function fail(message){
    if(finished)return;
    finished=true;clearTimeout(timer);
    document.getElementById('status').textContent=message;
    document.getElementById('launch').setAttribute('aria-busy','false');
    document.getElementById('spinner').hidden=true;
    var retry=document.getElementById('retry');retry.hidden=false;retry.focus();
  }
  function check(){
    if(finished)return;
    var image=new Image();
    image.onload=function(){if(finished)return;finished=true;clearTimeout(timer);location.replace('http://127.0.0.1:11476/');};
    image.onerror=function(){if(!finished)setTimeout(check,400);};
    image.src='http://127.0.0.1:11476/favicon.png?t='+Date.now();
  }
  try{bridge=new PalmServiceBridge();bridge.onservicecallback=function(){};bridge.call('luna://app.hasimio.tv.service/start',JSON.stringify({subscribe:true}));check();}
  catch(error){fail('Hasimio could not open. Please close the app and try again.');}
})();
</script></body></html>
